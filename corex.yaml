    dest: ./resources/[corex]/corex-redzones

  - action: download_github
    src: https://github.com/corex-zombies/corex-loot
    ref: 98397bfe22fb196ad41ade5e8f6fb26e4a6ca8b8
    dest: ./resources/[corex]/corex-loot

  - action: download_github
    src: https://github.com/corex-zombies/corex-skills
    ref: 687e30b5fd546cb13898f636e35a23cecdb5d561
    dest: ./resources/[corex]/corex-skills

  - action: download_github
    src: https://github.com/corex-zombies/corex-admin
    ref: a500d850124273f29f3a4e2d61b8b37b575727d8
    dest: ./resources/[corex]/corex-admin

  # ──────────────── Cleanup ────────────────
  - action: remove_path
    path: ./tmp

  - action: waste_time
    seconds: 1
