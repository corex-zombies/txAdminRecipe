    ref: d01664ccd5c8343c99cc6ba6a6b1f6d1e6243e9b
    dest: ./resources/[corex]/corex-notify

  - action: download_github
    src: https://github.com/corex-zombies/corex-events
    ref: f911d686a8a0319b6167fd6c9683b3215df52ecf
    dest: ./resources/[corex]/corex-events

  - action: download_github
    src: https://github.com/corex-zombies/corex-weather
    ref: e2b1e15db009b803ea23605c8dd4b4937cdc373e
    dest: ./resources/[corex]/corex-weather

  - action: download_github
