    dest: ./resources/[corex]/corex-lab

  - action: download_github
    src: https://github.com/corex-zombies/corex-ui-proxies
    ref: da8598620f20a76b65a780714a7c62f2cb126d2f
    dest: ./resources/[corex-ui-proxies]

  - action: download_github
