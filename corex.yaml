$engine: 3
$onesync: on
$minFxVersion: 12913
name: COREX Framework
version: 1.0.0
author: ABUGIZA
description: Modern FiveM Zombie-Survival framework — Lua 5.4, oxmysql, StateBag sync.

variables: {}

tasks:
  # ──────────────── Base Files ────────────────
  - action: download_github
    src: https://github.com/corex-zombies/txAdminRecipe
    ref: 1994c96397a994a52d665b39f9488a9f629f14eb
    dest: ./tmp/corex_recipe

  - action: move_path
    src: ./tmp/corex_recipe/server.cfg
    dest: ./server.cfg

  # ──────────────── Database ────────────────
  - action: connect_database
  - action: query_database
    file: ./tmp/corex_recipe/corex_framework.sql

  # ──────────────── CFX Default Resources ────────────────
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: 32d98e7524b952faf8b220d719615b0346b0a6cc
    subpath: resources
    dest: ./tmp/cfx_resources

  # Only the required managers/events are installed. CFX example money scripts,
  # development runcode, example loadscreen and RedM maps are not COREX gameplay.
  - action: move_path
    src: ./tmp/cfx_resources/[managers]/mapmanager
    dest: ./resources/[cfx-default]/mapmanager
  - action: move_path
    src: ./tmp/cfx_resources/[managers]/spawnmanager
    dest: ./resources/[cfx-default]/spawnmanager
  - action: move_path
    src: ./tmp/cfx_resources/[system]/baseevents
    dest: ./resources/[cfx-default]/baseevents

  # ──────────────── Standalone Dependencies ────────────────
  - action: download_file
    path: ./tmp/files/oxmysql.zip
    url: https://github.com/overextended/oxmysql/releases/download/v2.14.1/oxmysql.zip
  - action: unzip
    src: ./tmp/files/oxmysql.zip
    dest: ./resources/[standalone]

  # corex-admin requires the built ox_lib release (including its web assets).
  - action: download_file
    path: ./tmp/files/ox_lib.zip
    url: https://github.com/overextended/ox_lib/releases/download/v3.39.0/ox_lib.zip
  - action: unzip
    src: ./tmp/files/ox_lib.zip
    dest: ./resources/[standalone]

  # ──────────────── Map / Asset Resources ────────────────
  - action: move_path
    src: ./tmp/corex_recipe/assets/patoche_halloween_house
    dest: ./resources/[assets]/patoche_halloween_house

  # ──────────────── COREX Resources ────────────────
  - action: download_github
    src: https://github.com/corex-zombies/corex-core
    ref: 08f37a7119cc3e17d5c7e969e930bd56d7bb4094
    dest: ./resources/[corex]/corex-core

  - action: download_github
    src: https://github.com/corex-zombies/corex-spawn
    ref: c979b136ea2a8807eecaf8dce3c4f44051539128
    dest: ./resources/[corex]/corex-spawn

  - action: download_github
    src: https://github.com/corex-zombies/corex-death
    ref: 22edd2d429b6b4993e02666af21395d86310f347
    dest: ./resources/[corex]/corex-death

  - action: download_github
    src: https://github.com/corex-zombies/corex-hud
    ref: 51ef0b8bc21cbb69aad9c12dd300e4a0363cfffd
    dest: ./resources/[corex]/corex-hud

  - action: download_github
    src: https://github.com/corex-zombies/corex-survival
    ref: e6b0084b3ad2c14ed9e8e62e8db16631cc2eb7f9
    dest: ./resources/[corex]/corex-survival

  - action: download_github
    src: https://github.com/corex-zombies/corex-inventory
    ref: 3af83d34a14f5725133d02bb1be2b3e2a11dcb75
    dest: ./resources/[corex]/corex-inventory

  # Compatibility services are installed as separate resources so CoreX remains
  # native-first while framework facades and content packs can evolve safely.
  - action: download_github
    src: https://github.com/corex-zombies/corex-capabilities
    ref: 709e440341b9f496b37f86f0b29fc640ea2085c6
    dest: ./resources/[corex]/corex-capabilities

  - action: download_github
    src: https://github.com/corex-zombies/corex-ui-compat
    ref: 0dd029e1f9ec7722aa1d1572ac1c7342e2cc691c
    dest: ./resources/[corex]/corex-ui-compat

  - action: download_github
    src: https://github.com/corex-zombies/corex-adapters
    ref: 8fc00c2336318d37c69ee6f8e3a63c6ec1091ce5
    dest: ./resources/[corex]/corex-adapters

  - action: download_github
    src: https://github.com/corex-zombies/qb-core
    ref: 96a60a783579a64aec788f504d6ebc88e6ae270d
