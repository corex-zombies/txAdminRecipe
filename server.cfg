# =====================================================
#  COREX Framework — server.cfg
#  Auto-generated by txAdmin recipe deployment.
#  Edit values marked with CHANGE_ME before going live.
# =====================================================

## Server identity
sv_hostname "COREX Zombies — built with FiveM"
sets sv_projectName "COREX Framework"
sets sv_projectDesc "Modern FiveM Zombie-Survival framework."
sets tags "zombies, survival, corex, default, deployer"
sets locale "root-AQ"

## Gameplay
sv_enforceGameBuild 3258
sv_maxclients 48
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
set steam_webApiKey "none"
set resources_useSystemChat true

## Cfx.re license key — generate at https://keymaster.fivem.net/
sv_licenseKey "CHANGE_ME_CFX_LICENSE_KEY"

## MySQL connection (oxmysql)
## txAdmin auto-fills {{dbConnectionString}} during deployment from the
## database credentials you entered in the wizard. No manual edit needed.
set mysql_connection_string "{{dbConnectionString}}"

## Resource load order
ensure [cfx-default]
ensure [standalone]
ensure [assets]
ensure [corex]

## Permissions
add_ace group.admin command allow
add_ace group.admin command.quit deny
add_ace group.admin corex.weather.admin allow

## Admins (replace with your identifiers)
# add_principal identifier.fivem:XXXXXXX group.admin
# add_principal identifier.discord:XXXXXXXXXXXXXXXXXX group.admin
