# =====================================================
#  COREX Framework — server.cfg
#  Auto-generated by txAdmin recipe deployment.
#  txAdmin auto-fills {{svLicense}} and {{dbConnectionString}}
#  from the data you entered in the setup wizard.
# =====================================================

## Server identity
sv_hostname "COREX Zombies — built with FiveM"
sets sv_projectName "COREX Framework"
sets sv_projectDesc "Modern FiveM Zombie-Survival framework."
sets tags "zombies, survival, corex, default, deployer"
sets locale "root-AQ"

## Gameplay
sv_enforceGameBuild 3258
sv_maxclients 48
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
set steam_webApiKey "none"
set resources_useSystemChat true

## Cfx.re server registration key — filled from the recipe input parameters.
## Obtain it privately at https://portal.cfx.re/ (account linking is not enough).
sv_licenseKey "{{svLicense}}"

## MySQL connection (oxmysql) — auto-filled by txAdmin from the database
## credentials you entered in the wizard. No manual edit needed.
set mysql_connection_string "{{dbConnectionString}}"

## Permissions must exist before framework facades register their commands.
add_ace group.admin command allow
add_ace group.admin command.quit deny
add_ace group.admin corex.weather.admin allow
add_ace group.admin corex.admin allow
add_ace group.admin corex.compat.status allow
add_ace resource.qb-core command allow

## Resource load order — never start CFX example/test groups wholesale.
ensure mapmanager
ensure chat
ensure spawnmanager
ensure baseevents
ensure oxmysql
ensure ox_lib
ensure [assets]
ensure corex-core
ensure corex-capabilities
ensure corex-ui-compat
ensure corex-inventory
ensure corex-adapters
ensure qb-core
ensure qbx_core
ensure es_extended
ensure corex-content
ensure progressbar
ensure qb-input
ensure qb-menu
ensure esx_context
ensure esx_notify
ensure esx_progressbar
ensure esx_textui
# Start remaining gameplay without restarting the initialized foundation.
start [corex]

